# Erstellt automatisch ein GitHub-Release, sobald sich die Versionsnummer in der Datei VERSION ändert.
# Alle installierten xImJxstinnCord-Versionen holen sich das Update dann selbst.
#
# Neue Version veröffentlichen: Zahl in VERSION erhöhen (z. B. 1.2.0 → 1.3.0), committen, pushen. Fertig.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: v
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION gibt es schon – nichts zu tun. (Für ein Update die Zahl in VERSION erhöhen.)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-go@v5
        if: steps.v.outputs.exists == 'false'
        with:
          go-version: "1.22"
          cache: false

      - name: Prüfen
        if: steps.v.outputs.exists == 'false'
        run: |
          for f in mod/patcher.js mod/preload.js mod/renderer.js; do node --check "$f"; done
          go vet ./...

      - name: Installer bauen
        if: steps.v.outputs.exists == 'false'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.ModVersion=${{ steps.v.outputs.version }}" -o xImJxstinnCord-Installer.exe .

      - name: Release veröffentlichen
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: xImJxstinnCord ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            mod/patcher.js
            mod/preload.js
            mod/renderer.js
            xImJxstinnCord-Installer.exe
