# Erstellt automatisch ein GitHub-Release, sobald du einen Tag wie v1.1.0 pushst.
# Alle installierten xImJxstinnCord-Versionen holen sich das Update dann selbst.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Version aus dem Tag lesen
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Prüfen
        run: |
          for f in mod/patcher.js mod/preload.js mod/renderer.js; do node --check "$f"; done
          go vet ./...

      - name: Installer bauen
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.ModVersion=${VERSION}" -o xImJxstinnCord-Installer.exe .

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: xImJxstinnCord ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            mod/patcher.js
            mod/preload.js
            mod/renderer.js
            xImJxstinnCord-Installer.exe
